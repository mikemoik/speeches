<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="296" viewBox="0 0 1000 296"
     font-family="'Segoe UI','DejaVu Sans',Tahoma,Arial,sans-serif">
  <defs>
    <filter id="blur" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- window frame -->
  <rect x="0.5" y="0.5" width="999" height="295" fill="#f4f4f4" stroke="#6f6f6f" stroke-width="1"/>

  <!-- title bar -->
  <rect x="1" y="1" width="998" height="28" fill="#2a5699"/>
  <text x="12" y="20" fill="#ffffff" font-size="14" font-weight="bold">IBM Rational DOORS</text>
  <text x="178" y="20" fill="#cdd9f0" font-size="13">Formal module: 'HD Map Requirements'  —  /HD Map/Localization</text>
  <rect x="912" y="6" width="18" height="17" fill="#3c66a6" stroke="#9bb4d8"/>
  <text x="918" y="19" fill="#fff" font-size="12">_</text>
  <rect x="934" y="6" width="18" height="17" fill="#3c66a6" stroke="#9bb4d8"/>
  <text x="939" y="19" fill="#fff" font-size="11">&#9633;</text>
  <rect x="956" y="6" width="18" height="17" fill="#b23b38" stroke="#9bb4d8"/>
  <text x="961" y="19" fill="#fff" font-size="12" font-weight="bold">&#215;</text>

  <!-- menu bar -->
  <rect x="1" y="29" width="998" height="21" fill="#ececec" stroke="#d6d6d6"/>
  <text x="12" y="44" fill="#1a1a1a" font-size="13">File &#160;&#160; Edit &#160;&#160; View &#160;&#160; Insert &#160;&#160; Link &#160;&#160; Analysis &#160;&#160; Table &#160;&#160; Tools &#160;&#160; Discussions &#160;&#160; Change &#160;&#160; User &#160;&#160; Help</text>

  <!-- toolbar -->
  <rect x="1" y="50" width="998" height="29" fill="#f3f3f3" stroke="#dadada"/>
  <g fill="#ffffff" stroke="#b9b9b9">
    <rect x="10" y="57" width="18" height="16"/><rect x="30" y="57" width="18" height="16"/>
    <rect x="50" y="57" width="18" height="16"/>
    <rect x="80" y="57" width="18" height="16"/><rect x="100" y="57" width="18" height="16"/>
    <rect x="130" y="57" width="18" height="16"/><rect x="150" y="57" width="18" height="16"/>
  </g>
  <text x="640" y="69" fill="#444" font-size="12">View:</text>
  <rect x="678" y="56" width="170" height="18" fill="#ffffff" stroke="#9fb0c6"/>
  <text x="686" y="69" fill="#1a1a1a" font-size="12">Standard view</text>
  <text x="832" y="69" fill="#555" font-size="11">&#9662;</text>

  <!-- column header row -->
  <rect x="1" y="79" width="998" height="26" fill="#dce6f1" stroke="#aab6c6"/>
  <line x1="58"  y1="79" x2="58"  y2="275" stroke="#c4ccd6"/>
  <line x1="188" y1="79" x2="188" y2="275" stroke="#c4ccd6"/>
  <text x="20"  y="97" fill="#33405a" font-size="12" font-weight="bold">#</text>
  <text x="110" y="97" fill="#33405a" font-size="13" font-weight="bold" text-anchor="middle">ID</text>
  <text x="200" y="97" fill="#33405a" font-size="13" font-weight="bold">Object Text</text>

  <!-- heading object -->
  <rect x="1" y="105" width="998" height="32" fill="#eef3fa" stroke="#dde3ec"/>
  <text x="14"  y="126" fill="#222" font-size="13" font-weight="bold">2</text>
  <text x="200" y="127" fill="#15315e" font-size="16" font-weight="bold">2&#160;&#160;Localization requirements</text>

  <!-- selected requirement HD-001 — large text -->
  <rect x="2" y="137" width="996" height="70" fill="#cfe2ff" stroke="#5b8fd6" stroke-width="1.5"/>
  <text x="12"  y="179" fill="#222" font-size="14">2.1</text>
  <text x="123" y="180" fill="#0d0d0d" font-size="20" font-weight="bold" text-anchor="middle">HD-001</text>
  <text x="200" y="182" fill="#0a0a0a" font-size="27">The map-relative accuracy error shall not exceed 0.1 m.</text>

  <!-- fake requirements: smaller + slightly blurred text -->
  <rect x="2" y="207" width="996" height="34" fill="#ffffff" stroke="#e4e4e4"/>
  <text x="12"  y="229" fill="#555" font-size="12">2.2</text>
  <text x="110" y="229" fill="#555" font-size="12" text-anchor="middle">HD-002</text>
  <text x="200" y="230" fill="#3a3a3a" font-size="14" filter="url(#blur)">The localization estimate shall be available at 10 Hz.</text>

  <rect x="2" y="241" width="996" height="34" fill="#fafafa" stroke="#e4e4e4"/>
  <text x="12"  y="263" fill="#555" font-size="12">2.3</text>
  <text x="110" y="263" fill="#555" font-size="12" text-anchor="middle">HD-003</text>
  <text x="200" y="264" fill="#3a3a3a" font-size="14" filter="url(#blur)">The localization latency shall not exceed 50 ms.</text>

  <!-- status bar -->
  <rect x="1" y="275" width="998" height="20" fill="#ececec" stroke="#d6d6d6"/>
  <text x="12"  y="289" fill="#333" font-size="11">Username: mschweitzer</text>
  <text x="360" y="289" fill="#333" font-size="11">Exclusive edit mode</text>
  <text x="800" y="289" fill="#333" font-size="11">1 object selected</text>
</svg>
